[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hibiscus"
version = "0.1.0"
description = "Pairwise evaluation against a hand-rated reference pool."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hibiscus contributors" }]
keywords = ["evaluation", "llm-judge", "pairwise-comparison", "reward-model", "rlhf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
dev = ["pytest>=7.0", "anthropic>=0.40.0"]

[project.urls]
Repository = "https://github.com/safiqsindha/hibiscus"

[project.scripts]
hibiscus = "hibiscus.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hibiscus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
